services:
  db:
    image: postgres:16-alpine
    container_name: reservas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservas}
      POSTGRES_DB: ${POSTGRES_DB:-reservas}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservas} -d ${POSTGRES_DB:-reservas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: reservas-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reservas}:${POSTGRES_PASSWORD:-reservas}@db:5432/${POSTGRES_DB:-reservas}
      # Clave de la sesión del panel. La de abajo es SOLO para desarrollo:
      # en producción define SECRET_KEY en un archivo .env junto a este docker-compose.yml.
      SECRET_KEY: ${SECRET_KEY:-solo-desarrollo-cambia-esta-clave-en-produccion}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: reservas-web
    environment:
      # Dentro de Docker la API se llama "api" (el nombre del servicio).
      API_URL: http://api:8000/api/v1
      # La cookie del panel solo viaja por HTTPS si es "true". Mientras se entre por
      # http://IP:3000 debe ser "false" o el navegador la descarta y el panel vuelve al login.
      # Con HTTPS (dominio + certificado) define COOKIE_SECURE=true en el .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
